[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # Next.js intentionally embeds NEXT_PUBLIC_* values in browser bundles. The
  # remaining entries are public identifiers (not credentials) that can also
  # appear in generated output and dependency metadata.
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SITE_URL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_SUPABASE_ANON_KEY,SUPABASE_ANON_KEY,POSTGRES_USER"
  # Netlify's Next.js Runtime generates these folders from trusted environment
  # variables during the build. Source files remain covered by secret scanning.
  SECRETS_SCAN_OMIT_PATHS = ".next/**,.netlify/**"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/durotech-logo.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
